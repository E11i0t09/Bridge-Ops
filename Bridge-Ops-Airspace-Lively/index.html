:root{
  --a:#f39c4a; --b:#ffcc99; --c:#b4a6f2; --d:#7092e0; --e:#e2683f; --f:#d6a26a;
  --t:#ffd9b0; --dim:#3a2a1c; --bg:#000;
}
body[data-theme="1"]{ --a:#4d8ef2; --b:#a9cfff; --c:#68d2e6; --d:#2c5bb3; --e:#e8a548; --f:#7fa8d8; --t:#cfe4ff; --dim:#14233d; }
body[data-theme="2"]{ --a:#9aa3ad; --b:#d7dde3; --c:#c9a26b; --d:#6a7480; --e:#d9b36a; --f:#b6bec7; --t:#eef2f5; --dim:#24282d; }
/* Stahlblau: Schiefergrau-Rahmen, Cyan-Akzente, Lachsrot für Warnungen */
body[data-theme="3"]{ --a:#6f7a90; --b:#aab6cc; --c:#5cb9ec; --d:#3577b8; --e:#f2664e; --f:#4d566a; --t:#d3dcea; --dim:#182030; }
body.alert{ --a:#e2402c; --b:#ff9d8c; --c:#c9392a; --d:#b04a3e; --e:#ff6a3d; --f:#b5473a; --t:#ffc9bf; --dim:#3a0f0b; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden}
body{font-family:"Antonio","Arial Narrow",sans-serif;color:var(--t);text-transform:uppercase;-webkit-font-smoothing:antialiased;cursor:default;user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}

.side{position:absolute;left:0;width:200px;display:flex;flex-direction:column;gap:8px}
.blk{background:var(--a);color:#000;font-size:19px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 12px 5px;letter-spacing:.5px;transition:background .6s;min-height:0}
.blk.b{background:var(--b)} .blk.c{background:var(--c)} .blk.d{background:var(--d)} .blk.e{background:var(--e)} .blk.f{background:var(--f)}
.blk.blink{animation:blink 7s infinite}
.blk.btn{cursor:pointer}
.blk.btn:hover{filter:brightness(1.25)}
@keyframes blink{0%,90%,100%{filter:none}92%,96%{filter:brightness(1.6) saturate(.6)}94%{filter:none}}

.elbow{position:absolute;left:0;width:340px;height:80px;background:var(--a);transition:background .6s}
.elbow::after{content:"";position:absolute;left:200px;width:140px;height:54px;background:var(--bg)}
.elbow.down{border-bottom-left-radius:80px} .elbow.down::after{top:0;border-bottom-left-radius:40px}
.elbow.up{border-top-left-radius:80px} .elbow.up::after{top:26px;border-top-left-radius:40px}

.hbar{position:absolute;left:348px;right:0;height:26px;display:flex;gap:8px}
.hbar>div{height:100%;background:var(--a);position:relative;overflow:hidden;transition:background .6s}
.hbar>div:last-child{border-radius:0 13px 13px 0}
.hbar .b{background:var(--b)} .hbar .c{background:var(--c)} .hbar .d{background:var(--d)} .hbar .e{background:var(--e)} .hbar .f{background:var(--f)}
.runner::after{content:"";position:absolute;top:0;left:-80px;width:80px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:run 6s linear infinite}
@keyframes run{to{left:100%}}
.colon{animation:colon 2s steps(1) infinite}
@keyframes colon{50%{opacity:.25}}

.ph{display:flex;align-items:center;gap:8px;height:30px;margin-bottom:14px;flex:none}
.ph .cap{height:30px;width:22px;background:var(--a);border-radius:15px 0 0 15px;transition:background .6s}
.ph .lbl{font-size:27px;color:var(--a);padding:0 8px;line-height:30px;transition:color .6s;white-space:nowrap}
.ph .fill{flex:1;height:30px;background:var(--d);transition:background .6s}
.ph .end{height:30px;width:22px;background:var(--d);border-radius:0 15px 15px 0;transition:background .6s}
.ph .tag{font-size:19px;color:#000;background:var(--c);padding:0 10px;line-height:30px;white-space:nowrap;transition:background .6s}
.ph .tag.btn{cursor:pointer;background:var(--e)}

/* ---- Flugzeug-Details ---- */
.dt-head{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
.dt-call{font-size:38px;font-weight:700;color:var(--b);line-height:1}

/* Einheiten: intern metrisch, Anzeige wahlweise imperial */
const IMP = () => CFG.units==="imperial";
const UN = {
  t:  c => IMP() ? c*9/5+32 : c,              tU: () => IMP() ? "°F" : "°C",
  w:  k => IMP() ? k/1.609344 : k,            wU: () => IMP() ? "MPH" : "KM/H",
  d:  k => IMP() ? k/1.609344 : k,            dU: () => IMP() ? "MI" : "KM",
  p:  h => IMP() ? h*0.0295300 : h,           pU: () => IMP() ? "INHG" : "HPA",  pD: () => IMP() ? 2 : 0,
  r:  m => IMP() ? m/25.4 : m,                rU: () => IMP() ? "IN" : "MM",     rD: () => IMP() ? 2 : 1,
  l:  c => IMP() ? c/2.54 : c,                lU: () => IMP() ? "IN" : "CM"
};
const distTxt = (km,d=1) => `${nf(UN.d(km),d)} ${UN.dU()}`;

/* Statische Texte übersetzen: jeder Textknoten, dessen Text im Wörterbuch steht */
const _TN = [];
function tagStatic(root=document.body){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){ const t = n.nodeValue.trim(); if(t && EN[t]!==undefined && !n._de){ n._de=t; _TN.push(n); } }
}
function applyStatic(){ _TN.forEach(n=>{ if(n.isConnected) n.nodeValue = n.nodeValue.replace(n.nodeValue.trim(), T(n._de)); }); }

/* Sprach-Knopf */
function langButton(el, onChange){
  const draw = () => { el.innerHTML = `<span class="${isEN()?"":"on"}">DE</span><span class="${isEN()?"on":""}">EN</span>`; };
  el.addEventListener("click", ()=>{ CFG.lang = isEN() ? "de" : "en"; try{ localStorage.setItem("ops-lang", CFG.lang); }catch(e){} draw(); onChange(); });
  draw(); return draw;
}
/* Lively-Eigenschaft nur übernehmen, wenn sie sich seit dem letzten Start geändert hat (sonst gilt der Knopf) */
function propLang(val){
  const v = (+val===1) ? "en" : "de"; let last=null;
  try{ last = localStorage.getItem("ops-lang-prop"); localStorage.setItem("ops-lang-prop", v); }catch(e){}
  if(last===null || last!==v){ CFG.lang = v; try{ localStorage.setItem("ops-lang", v); }catch(e){} return true; }
  return false;
}

// Gemeinsame Werte (Ort, Proxy) in "ops-setup", seitenbezogene (Icon-Zone, Mitte, Reichweite) in "ops-setup-<seite>"
const SU_COMMON = ["name","lat","lon","adsbProxy","metarFav","sensorPort","netAdapter"], SU_PAGE = ["iconCols","iconCellW","iconCellH","radar","range"];
let SETUP_DONE = false;
const hasLoc = () => CFG.lat!=null && CFG.lon!=null && !isNaN(CFG.lat) && !isNaN(CFG.lon);
function loadSetup(){
  try{
    const c = JSON.parse(localStorage.getItem("ops-setup")||"null"), p = JSON.parse(localStorage.getItem("ops-setup-"+PAGE)||"null");
    if(c) SU_COMMON.forEach(k=>{ if(c[k]!==undefined) CFG[k]=c[k]; });
    if(p) SU_PAGE.forEach(k=>{ if(p[k]!==undefined) CFG[k]=p[k]; });
    SETUP_DONE = !!p;
  }catch(e){}
}
function saveSetup(){
  let c={}; try{ c=JSON.parse(localStorage.getItem("ops-setup")||"{}")||{}; }catch(e){}
  const p={}; SU_COMMON.forEach(k=>{ if(CFG[k]!==undefined) c[k]=CFG[k]; }); SU_PAGE.forEach(k=>p[k]=CFG[k]);
  try{ localStorage.setItem("ops-setup", JSON.stringify(c)); localStorage.setItem("ops-setup-"+PAGE, JSON.stringify(p));
       localStorage.setItem("ops-lang", CFG.lang); localStorage.setItem("ops-units", CFG.units); }catch(e){}
  SETUP_DONE = true;
}
/* Lively-Eigenschaft nur übernehmen, wenn sie in Lively geändert wurde – sonst gilt der Assistent bzw. der Knopf */
function propGate(name, val){
  const key="ops-prop-"+PAGE+"-"+name, v=JSON.stringify(val); let last=null;
  try{ last=localStorage.getItem(key); localStorage.setItem(key, v); }catch(e){ return true; }
  if(last===null) return !SETUP_DONE;   // erster Start: Lively-Werte gelten, solange nichts eingerichtet ist
  return last!==v;                       // später nur, wenn in Lively geändert
}

document.addEventListener("click", async e=>{
  const el=$("setup"); if(!el || !el.contains(e.target)) return;
  const t=e.target.closest("[data-k],[data-step],[data-act],[data-pick],[data-nic]"); if(!t) return;
  if(t.dataset.k){ const k=t.dataset.k; let v=t.dataset.v; if(k==="theme") v=+v; if(k==="radar") v=(v==="true"); SU[k]=v;
    if(k==="theme"){ CFG.theme=v; applyTheme(); }
    renderSetup(); return; }
  if(t.dataset.step){ const k=t.dataset.step; SU[k]=Math.max(+t.dataset.min, Math.min(+t.dataset.max, (+SU[k]||0)+(+t.dataset.d)));
    if(k.startsWith("icon")){ CFG[k]=SU[k]; fit(); } renderSetup(); return; }
  if(t.dataset.nic!==undefined){ SU.netAdapter=t.dataset.nic; renderSetup(); return; }
  if(t.dataset.pick){ const r=JSON.parse(t.dataset.pick); SU.name=r.n; SU.lat=r.a; SU.lon=r.o; renderSetup(); return; }
  const act=t.dataset.act;
  if(act==="up"||act==="down"){ const lg=el.querySelector(".su-legal"); if(lg) lg.scrollBy({top:(act==="up"?-1:1)*lg.clientHeight*.8, behavior:"smooth"}); return; }
  if(act==="info"||act==="back"){ keepInputs(); SU._info = act==="info"; renderSetup(); return; }
  if(act==="search"){ const q=($("suPlace").value||"").trim(); if(!q) return; $("suRes").textContent="…";
    try{ const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=6&language=${CFG.lang}`)).json();
      $("suRes").innerHTML=(j.results||[]).map(r=>`<div class="su-pick" data-pick='${JSON.stringify({n:r.name,a:r.latitude,o:r.longitude}).replace(/'/g,"&#39;")}'>${r.name}<span>${[r.admin1,r.country].filter(Boolean).join(", ")}</span></div>`).join("") || T("NICHTS GEFUNDEN");
    }catch(err){ $("suRes").textContent=T("KEINE VERBINDUNG"); } return; }
  if(act==="test"){ const u=($("suProxy").value||"").trim(); SU.adsbProxy=u; const r=$("suProxyRes"); if(!u){ r.textContent=T("Leer lassen = ohne Flugradar."); return; } r.textContent="…";
    try{ const j=await (await fetch(`${u}${u.includes("?")?"&":"?"}lat=${SU.lat}&lon=${SU.lon}&dist=40`,{cache:"no-store"})).json();
      r.textContent = Array.isArray(j.ac) ? T("OK · {0} FLUGZEUGE", j.ac.length) : T("ANTWORT UNGÜLTIG"); }catch(err){ r.textContent=T("NICHT ERREICHBAR"); } return; }
  if(act==="sensTest"){ const v=parseInt(($("suPort")||{}).value,10)||47047; const r=$("suSens"); r.textContent="…";
    try{ const res=await fetch(`http://127.0.0.1:${v}/`,{cache:"no-store"});
      if(res.status===403) r.innerHTML=`<b style="color:var(--e)">${T("ZUGRIFF ABGELEHNT")}</b> – ${T("der Sensor läuft, antwortet aber nur dem Wallpaper in Lively.")}`;
      else { const j=await res.json(); r.innerHTML = j.app==="Bridge-Ops-Sensor" ? sensLine(j) : T("ANTWORT UNGÜLTIG"); } }
    catch(err){ r.innerHTML=`<b style="color:var(--e)">${T("NICHT GEFUNDEN")}</b> – ${T("Sensor nicht installiert, beendet oder anderer Port.")}`; }
    return; }
  if(act==="cancel"){ closeSetup(false); return; }
  if(act==="ok"){ keepInputs(); if(SU.lat==null){ const f=$("suPlace"); if(f) f.focus(); return; } closeSetup(true); }
});

function closeSetup(apply){
  const el=$("setup"); if(el) el.remove();
  const s=SU; SU=null;
  CFG.iconGrid = s._grid;
  if(apply){
    const moved = s.lat!==CFG.lat || s.lon!==CFG.lon, langCh = s.lang!==CFG.lang || s.units!==CFG.units, radarCh = PAGE==="main" && s.radar!==CFG.radar, rangeCh = s.range!==CFG.range, proxyCh = s.adsbProxy!==CFG.adsbProxy, favCh = s.metarFav!==(CFG.metarFav||""), portCh = s.sensorPort!==CFG.sensorPort;
    Object.assign(CFG, { name:s.name, lat:s.lat, lon:s.lon, lang:s.lang, units:s.units, theme:s.theme, adsbProxy:s.adsbProxy,
      iconCols:s.iconCols, iconCellW:s.iconCellW, iconCellH:s.iconCellH, radar:s.radar, range:s.range, metarFav:s.metarFav, sensorPort:s.sensorPort, netAdapter:s.netAdapter });
    CFG.place=""; saveSetup(); saveCfg();
    onSetupApplied({moved, langCh, radarCh, rangeCh, proxyCh, favCh, portCh});
  } else {
    // Vorschau zurücknehmen, Assistent gilt trotzdem als gesehen
    Object.assign(CFG, s._orig); applyTheme(); saveSetup();
  }
  fit();
}
function sensLine(j){ return `<b style="color:var(--c)">${T("VERBUNDEN")}</b> · V${j.ver} · PORT ${j.port||"?"}${j.net&&j.net.name?" · "+String(j.net.name).replace(/[<>&]/g,""):""} · ${T("{0} LAUFWERKE",(j.disks||[]).length)}${j.vram?" · VRAM":""}`; }
function nicChoice(){
  const nics = typeof SENS!=="undefined" && sensFresh() ? (SENS.data.nics||[]) : [];
  if(!nics.length) return `<div class="su-cur">${T("Auswahl nur mit laufendem Bridge-Ops-Sensor. Ohne Sensor misst Lively seinen ersten Adapter.")}</div>`;
  const esc=x=>String(x).replace(/[<>&"]/g,""), opts=[["",T("AUTOMATISCH")+(()=>{ const a=nics.find(n=>n.auto); return a?" ("+esc(a.name)+")":""; })()]].concat(nics.map(n=>[n.name,esc(n.name)]));
  const sel = SU.netAdapter && !nics.some(n=>n.name===SU.netAdapter) ? `<div class="su-cur">${T("Gewählter Adapter derzeit nicht verbunden: {0} – es wird automatisch gemessen.", esc(SU.netAdapter))}</div>` : "";
  return `<div class="su-seg" style="flex-direction:column;align-items:flex-start;gap:4px">${opts.map(([v,l])=>`<span data-nic="${esc(v)}" class="${(SU.netAdapter||"")===v?"on":""}" style="border-radius:19px;text-transform:none">${l}</span>`).join("")}</div>${sel}
    <div class="su-cur">${T("Nur verbundene Netzwerkkarten (LAN, WLAN), keine VPN- oder virtuellen Adapter.")}</div>`;
}
function sensStatus(){
  if(typeof SENS==="undefined") return "";
  if(sensFresh()) return sensLine(SENS.data);
  if(SENS.denied) return `<b style="color:var(--e)">${T("ZUGRIFF ABGELEHNT")}</b>`;
  return `${T("NICHT GEFUNDEN")} – ${T("Sensor nicht installiert, beendet oder anderer Port.")}`;
}

const WORLD = { arcs:null, bb:null, coast:null, border:null, loading:null, ok:false };
const GEO_LISTENERS = [];

async function loadWorld(){
  if(WORLD.ok) return true;
  if(WORLD.loading) return WORLD.loading;
  WORLD.loading = (async()=>{
    try{
      const topo = await (await fetch(WORLD_URL)).json();
      const [sx,sy] = topo.transform.scale, [tx,ty] = topo.transform.translate;
      // Bögen dekodieren (delta + Quantisierung)
      WORLD.arcs = topo.arcs.map(a=>{ let x=0,y=0; const out=new Float64Array(a.length*2);
        a.forEach((p,i)=>{ x+=p[0]; y+=p[1]; out[i*2]=x*sx+tx; out[i*2+1]=y*sy+ty; }); return out; });
      WORLD.bb = WORLD.arcs.map(a=>{ let x0=999,y0=999,x1=-999,y1=-999; for(let i=0;i<a.length;i+=2){ const x=a[i],y=a[i+1]; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } return [x0,y0,x1,y1]; });
      const walk = (g, f) => { const r = g.type==="Polygon" ? [g.arcs] : g.type==="MultiPolygon" ? g.arcs : [];
        r.forEach(poly=>poly.forEach(ring=>ring.forEach(i=>f(i<0?~i:i)))); };
      // Küste = Bögen des Land-Objekts, Grenzen = Bögen, die zwei Ländern gehören
      const coast = new Set(); topo.objects.land.geometries.forEach(g=>walk(g,i=>coast.add(i)));
      const cnt = new Map(); topo.objects.countries.geometries.forEach((g,gi)=>{ const seen=new Set(); walk(g,i=>{ if(!seen.has(i)){ seen.add(i); cnt.set(i,(cnt.get(i)||0)+1); } }); });
      WORLD.coast=[...coast]; WORLD.border=[...cnt].filter(([i,c])=>c>=2 && !coast.has(i)).map(([i])=>i);
      WORLD.ok = true; return true;
    }catch(e){ WORLD.loading=null; return false; }
  })();
  return WORLD.loading;
}
/* Ausschnitt um den Standort (Radius in km) als Linienzüge [lon,lat] */
function buildGeo(lat, lon, radKm){
  if(!WORLD.ok) return false;
  const dLat = radKm/110.57, dLon = radKm/(111.32*Math.max(.05,Math.cos(lat*Math.PI/180)));
  const B = [lon-dLon, lat-dLat, lon+dLon, lat+dLat];
  const pick = ids => { const runs=[];
    for(const i of ids){ const b=WORLD.bb[i]; if(b[2]<B[0]||b[0]>B[2]||b[3]<B[1]||b[1]>B[3]) continue;
      const a=WORLD.arcs[i]; let cur=[];
      for(let k=0;k<a.length;k+=2){ const x=a[k], y=a[k+1], inb = x>=B[0]-.2&&x<=B[2]+.2&&y>=B[1]-.2&&y<=B[3]+.2;
        if(inb) cur.push([x,y]); else { if(cur.length>1) runs.push(cur); cur=[]; } }
      if(cur.length>1) runs.push(cur); }
    return runs; };
  GEO = { coast: pick(WORLD.coast), border: pick(WORLD.border) };
  GEO_LISTENERS.forEach(f=>f());
  return true;
}
async function refreshGeo(radKm){ if(await loadWorld()) buildGeo(CFG.lat, CFG.lon, radKm); }

  const hit=r=>boxes.some(b=>r[0]<b[2]&&r[2]>b[0]&&r[1]<b[3]&&r[3]>b[1]);
  const vis=[]; for(const a of APTS){ const [px,py]=xy(a[2],a[3]); if(px<8||py<8||px>W-8||py>H-8) continue; vis.push([a,px,py]); }
  vis.sort((p,q)=>p[0][4]-q[0][4]);
  let n=0; const max=o.max||40;
  for(const [a,px,py] of vis){
    if(n>=max) break;
    const lbl = o.long ? `${a[0]} ${a[1]}` : (o.city ? a[1] : a[0]);
    const w = x.measureText(lbl).width, r=[px-6,py-7,px+10+w,py+7];

    for(const [k,p] of AIR.map) if(now-p.seen>60000){ AIR.map.delete(k); if(AIR.sel===k) selectPlane(null); }
    AIR.ok = true; AIR.msg = "";
    AIR.timer = setTimeout(loadAir, 10000);
  }catch(e){
    AIR.ok = false; AIR.msg = "KEINE ADS-B-DATEN";
    AIR.timer = setTimeout(loadAir, 30000);
  }
  AIR.listeners.forEach(f=>f());
}

/* Höhe → Farbe im Schema: Warnfarbe (tief) → Hauptfarbe → Akzent (hoch) */
function rgbOf(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
let ALT_STOPS=null;          // wird je Bild einmal aus dem Farbschema gelesen
const CK = () => document.body.classList.contains("cockpit");   // Glascockpit-Optik
function altStops(){ ALT_STOPS = CK() ? [[0,rgbOf(cssv("--g")||cssv("--a"))],[15000,rgbOf(cssv("--c"))],[35000,rgbOf(cssv("--m"))]]
                                       : [[0,rgbOf(cssv("--e"))],[15000,rgbOf(cssv("--a"))],[35000,rgbOf(cssv("--c"))]]; }
function altCol(ft){
  if(!ALT_STOPS) altStops();
  const s=ALT_STOPS, f=Math.max(0,Math.min(35000,ft||0));
  const i = f<=15000 ? 0 : 1, a=s[i][1], b=s[i+1][1], k=(f-s[i][0])/(s[i+1][0]-s[i][0]);
  return `rgb(${a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(",")})`;
}
const RAD=Math.PI/180;
function gcKm(la1,lo1,la2,lo2){ const a=Math.sin((la2-la1)*RAD/2)**2+Math.cos(la1*RAD)*Math.cos(la2*RAD)*Math.sin((lo2-lo1)*RAD/2)**2; return 12742*Math.asin(Math.min(1,Math.sqrt(a))); }
function gcPts(la1,lo1,la2,lo2,n){
  const p1=[Math.cos(la1*RAD)*Math.cos(lo1*RAD),Math.cos(la1*RAD)*Math.sin(lo1*RAD),Math.sin(la1*RAD)], p2=[Math.cos(la2*RAD)*Math.cos(lo2*RAD),Math.cos(la2*RAD)*Math.sin(lo2*RAD),Math.sin(la2*RAD)];
  const d=Math.acos(Math.max(-1,Math.min(1,p1[0]*p2[0]+p1[1]*p2[1]+p1[2]*p2[2]))); if(d<1e-6) return [[la1,lo1],[la2,lo2]];
  const out=[]; for(let i=0;i<=n;i++){ const t=i/n, A=Math.sin((1-t)*d)/Math.sin(d), B=Math.sin(t*d)/Math.sin(d), v=[A*p1[0]+B*p2[0],A*p1[1]+B*p2[1],A*p1[2]+B*p2[2]];
    out.push([Math.atan2(v[2],Math.hypot(v[0],v[1]))/RAD, Math.atan2(v[1],v[0])/RAD]); }
  return out;
}
/* aktuelle (hochgerechnete) Position */
function livePos(p){
  const dt = Math.min(30, Math.max(0,(Date.now()-p.t)/1000)), d = p.gs*1.852/3600*dt, tr = p.trk*Math.PI/180;
  let [e,n] = proj(p.lat,p.lon); e += Math.sin(tr)*d; n += Math.cos(tr)*d;
  return { e, n, dist:Math.hypot(e,n), brg:(Math.atan2(e,n)*180/Math.PI+360)%360 };
}
function planesSorted(){
  const out=[]; for(const p of AIR.map.values()){ const q=livePos(p); if(q.dist<=CFG.range*1.04) out.push({p,...q}); }
  return out.sort((a,b)=>a.dist-b.dist);
}

/* ---------- Auswahl + Zusatzinfos ---------- */
function selectPlane(hex){
  AIR.sel = hex;
  if(hex){ const p = AIR.map.get(hex); if(p){ loadInfo(p); loadTrail(p); } }
  AIR.listeners.forEach(f=>f());
}
/* mitgeschriebene Flugbahn vom Proxy (bis 2 h), wird mit den Live-Punkten zusammengeführt */
async function loadTrail(p){
  if(!CFG.adsbProxy) return;
  try{
    const j = await (await fetch(proxyUrl(`trail=${encodeURIComponent(p.hex)}`), {cache:"no-store"})).json();
    const pts = (j.trail||[]).map(q=>[q[1],q[2],q[3],q[0]]);
    if(!pts.length) return;
    const first = p.trail.length ? p.trail[0][3] : Infinity;
    p.hist = pts.filter(q=>q[3] < first-2);
    AIR.listeners.forEach(f=>f());
  }catch(e){}
}
async function loadInfo(p){
  if(!CFG.adsbProxy || AIR.info.has(p.hex)) return;
  AIR.info.set(p.hex, {state:"loading"});
  try{
    const r = await fetch(proxyUrl(`info=1&hex=${encodeURIComponent(p.hex)}&cs=${encodeURIComponent(p.call)}&plat=${p.lat}&plon=${p.lon}`));
    AIR.info.set(p.hex, {state:"ok", data: await r.json()});
  }catch(e){ AIR.info.set(p.hex, {state:"err"}); setTimeout(()=>AIR.info.delete(p.hex), 60000); }
  AIR.listeners.forEach(f=>f());
}
function detailHTML(){

/* ---------- Radar-Zeichnung ---------- */
class Scope{
  constructor(canvas, o){ this.c=canvas; this.o=Object.assign({labels:8,font:15,ringLabels:true,airports:true,big:false,corner:26},o); this.st=null; this.list=[];
    if(this.o.noClick) return;
    canvas.addEventListener("click", ev=>{ const r=canvas.getBoundingClientRect(); const k=this.W/r.width;
      const x=(ev.clientX-r.left)*k, y=(ev.clientY-r.top)*k; let best=null, bd=22;
      for(const it of this.list){ const d=Math.hypot(it.px-x,it.py-y); if(d<bd){bd=d;best=it;} }
      selectPlane(best ? best.p.hex : null); });
    canvas.style.cursor="crosshair";
  }
  resize(W, H, ratio){ if(ratio===undefined){ ratio=H; H=W; } this.W=W; this.H=H; this.r=ratio; const c=this.c;
    c.style.width=W+"px"; c.style.height=H+"px"; c.width=Math.round(W*ratio); c.height=Math.round(H*ratio); this.invalidate(); }
  invalidate(){ this.st=null; }
  rng(){ return this.o.range || CFG.range; }
  geom(){ const pad = CK() ? (this.o.big?52:50) : (this.o.big?14:10); return {cx:this.W/2, cy:this.H/2, R:Math.min(this.W,this.H)/2-pad}; }
  xy(lat,lon){ const {cx,cy,R}=this.geom(); const [e,n]=proj(lat,lon); return [cx+e/this.rng()*R, cy-n/this.rng()*R]; }
  rr(x){ const w=this.W, h=this.H, r=this.o.corner; x.beginPath(); x.moveTo(r,0); x.lineTo(w-r,0); x.arcTo(w,0,w,r,r); x.lineTo(w,h-r); x.arcTo(w,h,w-r,h,r); x.lineTo(r,h); x.arcTo(0,h,0,h-r,r); x.lineTo(0,r); x.arcTo(0,0,r,0,r); x.closePath(); }
  buildStatic(){
    const W=this.W, H=this.H, k=this.r, off=document.createElement("canvas"); off.width=Math.round(W*k); off.height=Math.round(H*k);
    const x=off.getContext("2d"); x.setTransform(k,0,0,k,0,0);
    const {cx,cy,R}=this.geom(), big=this.o.big, cA=cssv("--a"), cB=cssv("--b"), cC=cssv("--c"), cD=cssv("--d"), cF=cssv("--f");
    x.save(); this.rr(x); x.clip();
    if(CK()){ this.ndStatic(x); x.restore(); this.rr(x); x.strokeStyle="#2a2e33"; x.lineWidth=2; x.stroke(); this.st=off; return; }
    x.fillStyle=hexA(cssv("--dim"),.45); x.fillRect(0,0,W,H);

    x.lineJoin="round"; x.strokeStyle=hexA(cF,.95); x.lineWidth=big?1.6:1.3;
    for(const l of GEO.coast){ x.beginPath(); l.forEach((pt,i)=>{ const [px,py]=this.xy(pt[1],pt[0]); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); }
    x.setLineDash([6,5]); x.strokeStyle=hexA(cC,.55); x.lineWidth=1.2;
    for(const l of GEO.border){ x.beginPath(); l.forEach((pt,i)=>{ const [px,py]=this.xy(pt[1],pt[0]); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); }
    // Entfernungsringe (dezent, gestrichelt)
    x.setLineDash([3,6]); x.strokeStyle=hexA(cD,.6); x.lineWidth=1;
    for(let i=1;i<=4;i++){ x.beginPath(); x.arc(cx,cy,R*i/4,0,7); x.stroke(); }
    x.setLineDash([]);
    if(this.o.ringLabels){ x.fillStyle=hexA(cD,.95); x.font=`${big?15:13}px Antonio, sans-serif`; x.textAlign="left"; x.textBaseline="middle";
      for(let i=1;i<=4;i++) x.fillText(nf(UN.d(this.rng()*i/4), IMP()?1:0)+(i===4?" "+UN.dU():""), cx+R*i/4*0.71+4, cy-R*i/4*0.71); }

    x.fillStyle=cA; x.font=`${big?22:18}px Antonio, sans-serif`; x.textAlign="center"; x.fillText("N", W-36, 36);
    x.beginPath(); x.moveTo(W-36,48); x.lineTo(W-30,62); x.lineTo(W-42,62); x.closePath(); x.fill();
    x.restore();
    this.rr(x); x.strokeStyle=cD; x.lineWidth=3; x.stroke();
    this.st=off;
  }
  /* Navigationsdisplay (Glascockpit): Kompassrose, gestrichelte Ringe, Flugplatzsterne */
  ndStatic(x){
    const W=this.W, H=this.H, {cx,cy,R}=this.geom(), big=this.o.big, wh=cssv("--b"), cy2=cssv("--c"), F=big?17:14;
    this.ndR=R;
    x.fillStyle="#000"; x.fillRect(0,0,W,H);
    const xy=(la,lo)=>{ const [e,n]=proj(la,lo); return [cx+e/this.rng()*R, cy-n/this.rng()*R]; };
    x.strokeStyle="rgba(140,150,160,.35)"; x.lineWidth=1.2;
    for(const l of GEO.coast){ x.beginPath(); l.forEach((pt,i)=>{ const [px,py]=xy(pt[1],pt[0]); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); }
    x.setLineDash([5,7]); x.strokeStyle="rgba(140,150,160,.25)"; for(const l of GEO.border){ x.beginPath(); l.forEach((pt,i)=>{ const [px,py]=xy(pt[1],pt[0]); i?x.lineTo(px,py):x.moveTo(px,py); }); x.stroke(); }
    x.setLineDash([4,8]); x.strokeStyle="rgba(242,242,242,.55)"; x.lineWidth=1.2; for(const f of [.25,.5,.75]){ x.beginPath(); x.arc(cx,cy,R*f,0,7); x.stroke(); } x.setLineDash([]);
    x.strokeStyle=wh; x.lineWidth=2; x.beginPath(); x.arc(cx,cy,R,0,7); x.stroke();
    x.font=`${F+2}px B612, sans-serif`; x.textAlign="center"; x.textBaseline="middle";
    for(let d=0;d<360;d+=5){ const a=(d-90)*Math.PI/180, l=d%10?6:(d%30?10:16); x.lineWidth=d%30?1:2; x.beginPath(); x.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); x.lineTo(cx+Math.cos(a)*(R+l),cy+Math.sin(a)*(R+l)); x.stroke();
      if(d%30===0){ x.fillStyle=wh; x.fillText(String(d/10),cx+Math.cos(a)*(R+30),cy+Math.sin(a)*(R+30)); } }
    x.font=`${F}px B612, sans-serif`; x.fillStyle=cy2; x.textAlign="left";
    for(const f of [.5,1]) x.fillText(nf(UN.d(this.rng()*f),0),cx+R*f*.72+6,cy-R*f*.72);
    // Flugplätze als ND-Symbol
    const shown=[]; for(const a of APTS){ if(a[4]>1) continue; const [px,py]=xy(a[2],a[3]); if(Math.hypot(px-cx,py-cy)>R-8) continue; if(shown.some(q=>Math.hypot(q[0]-px,q[1]-py)<40)) continue; shown.push([px,py]); if(shown.length>(big?30:14)) break;
      x.strokeStyle=cy2; x.lineWidth=1.5; x.beginPath(); x.arc(px,py,5,0,7); x.stroke(); x.beginPath(); for(let k=0;k<4;k++){ const an=k*Math.PI/2; x.moveTo(px+Math.cos(an)*5,py+Math.sin(an)*5); x.lineTo(px+Math.cos(an)*10,py+Math.sin(an)*10); } x.stroke();
      x.fillStyle=cy2; x.fillText(a[0],px+13,py+1); }
    // Eigenposition
    x.fillStyle="#ffe14a"; x.beginPath(); x.moveTo(cx,cy-13); x.lineTo(cx+5,cy+9); x.lineTo(cx,cy+5); x.lineTo(cx-5,cy+9); x.closePath(); x.fill();
    x.font=`${F}px B612, sans-serif`; x.textAlign="left"; x.fillStyle=cssv("--c"); x.fillText("RNG "+nf(UN.d(this.rng()),0)+" "+UN.dU(),14,24);
    x.textAlign="right"; x.fillStyle=cssv("--a"); x.fillText("TFC · MAP · N UP",W-14,24);
  }
  /* Bahn des gewählten Flugzeugs, nach Höhe eingefärbt (warm unten → kalt oben, im Farbschema) */
  drawTrack(x,p,px,py){
    const pts=(p.hist||[]).concat(p.trail); if(pts.length<1) return;
    pts.push([null,null,p.alt,Math.round(Date.now()/1000)]);
    x.lineCap="round"; x.lineWidth=this.o.big?3.2:2.6;
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1], b=pts[i]; if(b[3]-a[3]>300) continue;          // Lücke > 5 min: nicht verbinden
      const [ax,ay]=this.xy(a[0],a[1]), [bx,by]= b[0]==null ? [px,py] : this.xy(b[0],b[1]);
      x.strokeStyle=altCol(((a[2]||0)+(b[2]||0))/2); x.beginPath(); x.moveTo(ax,ay); x.lineTo(bx,by); x.stroke();
    }
    x.lineCap="butt";
  }
  /* geplante Route: Großkreis Start → Ziel (gestrichelt), nur bei plausibler Route */
  drawRoute(x,p,px,py){
    const inf=AIR.info.get(p.hex), rt=inf&&inf.data&&inf.data.route; if(!rt||!rt.airports||rt.airports.length<2||rt.plausible===false) return;
    const ap=rt.airports.map(a=>APTS.find(q=>q[0]===a.icao)).filter(Boolean); if(ap.length<2) return;
    let best=null, bv=1e9;           // Teilstrecke, auf der das Flugzeug am ehesten liegt
    for(let i=0;i<ap.length-1;i++){ const o=ap[i], d=ap[i+1], v=gcKm(o[2],o[3],p.lat,p.lon)+gcKm(p.lat,p.lon,d[2],d[3])-gcKm(o[2],o[3],d[2],d[3]); if(v<bv){ bv=v; best=[o,d]; } }
    const [o,d]=best, ck=CK(), cD=ck?cssv("--m"):cssv("--d"), cC=ck?cssv("--m"):cssv("--c");
    x.setLineDash(ck?[12,8]:[7,7]); x.lineWidth=ck?2.2:1.6;
    const seg=(la1,lo1,la2,lo2,col)=>{ x.strokeStyle=col; x.beginPath(); gcPts(la1,lo1,la2,lo2,48).forEach((q,i)=>{ const [qx,qy]=this.xy(q[0],q[1]); i?x.lineTo(qx,qy):x.moveTo(qx,qy); }); x.stroke(); };
    seg(o[2],o[3],p.lat,p.lon,hexA(cD,.8)); seg(p.lat,p.lon,d[2],d[3],hexA(cC,.85));
    x.setLineDash([]);
  }
  /* TCAS-Symbolik: Raute hohl = Verkehr, gefüllt = nah, Kreis bernstein = Notfall-Squawk, Magenta = gewählt */
  tcas(x,p,px,py,sel,dist){
    const s=this.o.big?10:8, near=dist<10, col = sel ? cssv("--m") : (p.emerg ? cssv("--r") : (near ? cssv("--e") : cssv("--b")));
    x.fillStyle=col; x.strokeStyle=col; x.lineWidth=2; x.globalAlpha=p.ground?.45:1;
    if(p.emerg){ x.fillRect(px-s,py-s,2*s,2*s); }
    else if(near && !sel){ x.beginPath(); x.arc(px,py,s*.85,0,7); x.fill(); }
    else { x.beginPath(); x.moveTo(px,py-s); x.lineTo(px+s,py); x.lineTo(px,py+s); x.lineTo(px-s,py); x.closePath(); sel ? x.fill() : x.stroke(); }
    x.globalAlpha=1;
    const F=this.o.big?14:12; x.font=`${F}px B612, sans-serif`; x.textAlign="center"; x.textBaseline="bottom";
    x.fillText(p.ground?"GND":(p.alt>=6000?"FL"+String(Math.round(p.alt/100)).padStart(3,"0"):String(Math.round(p.alt/100)).padStart(3,"0")),px,py-s-3);
    if(p.rate!=null && Math.abs(p.rate)>=500){ x.textAlign="left"; x.textBaseline="middle"; x.font=`${F+4}px B612, sans-serif`; x.fillText(p.rate>0?"↑":"↓",px+s+3,py); }
  }
  ndLabels(x,list){
    const F=this.o.big?14:12; x.font=`${F}px B612, sans-serif`; x.textAlign="center"; x.textBaseline="top";
    list.filter(o=>o.sel||o.p.emerg).concat(list.filter(o=>!o.sel&&!o.p.emerg).slice(0,this.o.labels)).forEach(o=>{ x.fillStyle=o.sel?cssv("--m"):"rgba(242,242,242,.8)"; x.fillText(o.p.call||"?",o.px,o.py+(this.o.big?13:11)); });
    if(list.some(o=>o.sel)) this.drawAltLegend(x);
  }
  drawAltLegend(x){
    const w=this.o.big?190:150, h=8, lx=16, ly=this.H-30, F=this.o.big?13:12;
    x.fillStyle="rgba(0,0,0,.72)"; x.fillRect(lx-8,ly-F-10,w+16,h+F+16);
    for(let i=0;i<w;i++){ x.fillStyle=altCol(i/w*40000); x.fillRect(lx+i,ly,1.2,h); }
    x.font=`${F}px Antonio, sans-serif`; x.fillStyle=cssv("--d"); x.textBaseline="bottom";
    x.textAlign="left"; x.fillText("0",lx,ly-3); x.textAlign="center"; x.fillText("FL200",lx+w/2,ly-3); x.textAlign="right"; x.fillText("FL400",lx+w,ly-3);
  }
  draw(now){
    const c=this.c, x=c.getContext("2d"), W=this.W, H=this.H; if(!W) return;
    if(!this.st) this.buildStatic();
    x.setTransform(1,0,0,1,0,0); x.clearRect(0,0,c.width,c.height); x.drawImage(this.st,0,0);
    x.setTransform(this.r,0,0,this.r,0,0);
    const {cx,cy,R}=this.geom(), cA=cssv("--a"), cB=cssv("--b"), cC=cssv("--c"), cD=cssv("--d"), cE=cssv("--e");
    if(AIR.sel) altStops();
    x.save(); this.rr(x); x.clip();
    if(AIR.msg){ x.fillStyle=cA; x.textAlign="center"; x.textBaseline="middle"; x.font=`${this.o.font+2}px Antonio, sans-serif`; x.fillText(T(AIR.msg),cx,cy+R*.25); }
    // Flugzeuge (alles, was im Rechteck liegt)
    const list=[], sz=this.o.big?10:8;
    for(const p of AIR.map.values()){
      const it=livePos(p), px=cx+it.e/this.rng()*R, py=cy-it.n/this.rng()*R;
      if(px<-10||py<-10||px>W+10||py>H+10) continue;
      const sel=AIR.sel===p.hex, col = p.emerg ? cE : (p.alt<10000 ? cE : cB);
      if(sel){ this.drawRoute(x,p,px,py); this.drawTrack(x,p,px,py); }
      else if(p.trail.length>1){ x.beginPath(); const tr=p.trail.slice(-14);
        tr.forEach((q,i)=>{ const [qx,qy]=this.xy(q[0],q[1]); i?x.lineTo(qx,qy):x.moveTo(qx,qy); }); x.lineTo(px,py);
        x.strokeStyle=cD; x.globalAlpha=.7; x.lineWidth=1.5; x.stroke(); x.globalAlpha=1; }
      if(CK()){ this.tcas(x,p,px,py,sel,it.dist); list.push({p,px,py,dist:it.dist,sel}); continue; }
      x.save(); x.translate(px,py); x.rotate(p.trk*Math.PI/180); x.globalAlpha = p.ground ? .45 : 1;
      x.beginPath(); x.moveTo(0,-sz); x.lineTo(sz*.7,sz*.75); x.lineTo(0,sz*.38); x.lineTo(-sz*.7,sz*.75); x.closePath(); x.fillStyle=col; x.fill(); x.restore(); x.globalAlpha=1;
      if(sel){ const b=sz+7; x.strokeStyle=cE; x.lineWidth=2; x.beginPath();
        for(const [sx,sy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ x.moveTo(px+sx*b,py+sy*(b-6)); x.lineTo(px+sx*b,py+sy*b); x.lineTo(px+sx*(b-6),py+sy*b); } x.stroke(); }
      if(p.emerg && Math.floor(now/500)%2){ x.beginPath(); x.arc(px,py,sz+10,0,7); x.strokeStyle=cE; x.lineWidth=2.5; x.stroke(); }
      list.push({p,px,py,dist:it.dist,sel});
    }
    list.sort((a,b)=>a.dist-b.dist);
    this.list=list;
    if(CK()){ this.ndLabels(x,list); x.restore(); return; }
    if(list.some(o=>o.sel)) this.drawAltLegend(x);
    // Beschriftung ohne Überlappung (Auswahl zuerst)
    const F=this.o.font; x.font=`${F}px Antonio, sans-serif`; x.textBaseline="middle"; const boxes=[[W-50,0,W,60]];
    const hit=r=>boxes.some(b=>r[0]<b[2]&&r[2]>b[0]&&r[1]<b[3]&&r[3]>b[1]);
    const lab = list.filter(o=>o.sel||o.p.emerg).concat(list.filter(o=>!o.sel&&!o.p.emerg).slice(0,this.o.labels));
    for(const o of lab){
      const l1=o.p.call||"?", l2=fmtAlt(o.p)+(o.p.gs?" · "+Math.round(o.p.gs)+" KT":"");
      const w=Math.max(x.measureText(l1).width, x.measureText(l2).width), h=F*2.3, g=sz+4;
      for(const [lx,ly] of [[o.px+g,o.py-h/2],[o.px-g-w,o.py-h/2],[o.px-w/2,o.py+g],[o.px-w/2,o.py-g-h]]){
        const r=[lx,ly,lx+w,ly+h]; if(lx<6||lx+w>W-6||ly<6||ly+h>H-6||hit(r)) continue;
        boxes.push(r); x.textAlign="left";
        x.fillStyle=o.sel?cE:(o.p.emerg?cE:cB); x.fillText(l1,lx,ly+F*.55); x.fillStyle=cC; x.fillText(l2,lx,ly+F*1.75); break;
      }
    }
    x.restore();
  }
}

/* ================== DIMMER + ANIMATION AN/AUS + WARN-AUFBLITZEN ================== */
const UI = { dim:100, anim:true, flashT:null, seen:new Set() };
try{ const u=JSON.parse(localStorage.getItem("ops-ui-"+PAGE)||"null"); if(u){ if(u.dim>=10&&u.dim<=100) UI.dim=u.dim; UI.anim=u.anim!==false; } }catch(e){}
function uiSave(){ try{ localStorage.setItem("ops-ui-"+PAGE, JSON.stringify({dim:UI.dim, anim:UI.anim})); }catch(e){} }
const dimLayer = document.createElement("div"); dimLayer.id="dimLayer"; document.body.appendChild(dimLayer);
function uiApply(){
  dimLayer.style.opacity = UI.flashT ? 0 : (100-UI.dim)/100;
  document.body.classList.toggle("calm", !UI.anim);
  const d=$("dimBtn"); if(d) d.innerHTML = `◐ <b>${UI.dim}%</b>`;
  const a=$("animBtn"); if(a){ a.textContent = UI.anim ? "❚❚" : "▶"; a.title = T(UI.anim ? "Animationen anhalten" : "Animationen starten"); a.classList.toggle("on", !UI.anim); }
  const p=$("dimPop"); if(p){ p.querySelector("i").style.width = ((UI.dim-10)/90*100)+"%"; p.querySelector("b").textContent = UI.dim+"%"; }
}
function setDim(v){ UI.dim=Math.max(10,Math.min(100,Math.round(v))); uiSave(); uiApply(); }
function setAnim(on){ UI.anim=!!on; uiSave(); uiApply(); }
/* Neue Warnung: 10 s volle Helligkeit */
function uiAlert(key){
  if(UI.seen.has(key)) return; UI.seen.add(key);
  if(UI.dim>=100) return;
  clearTimeout(UI.flashT); UI.flashT=setTimeout(()=>{ UI.flashT=null; uiApply(); }, 10000); uiApply();
}
function uiButtons(){
  const d=$("dimBtn"), a=$("animBtn"); if(!d||!a) return;
  d.title=T("Helligkeit"); a.onclick=()=>setAnim(!UI.anim);
  d.onclick=e=>{ e.stopPropagation(); let p=$("dimPop"); if(p){ p.remove(); return; }
    p=document.createElement("div"); p.id="dimPop";
    p.innerHTML=`<span class="dp-b" data-d="-10">−</span><div class="dp-bar"><i></i></div><span class="dp-b" data-d="10">+</span><b></b>`;
    // ins skalierte #stage hängen (nicht in die Leiste: die schneidet über overflow:hidden ab)
    const st=$("stage"); st.appendChild(p);
    const r=d.getBoundingClientRect(), sr=st.getBoundingClientRect(), sc=sr.width/st.offsetWidth||1;
    p.style.top=((r.bottom-sr.top)/sc+8)+"px"; p.style.left=Math.max(0,(r.right-sr.left)/sc - p.offsetWidth)+"px";
    const bar=p.querySelector(".dp-bar");
    const setFrom=ev=>{ const b=bar.getBoundingClientRect(); setDim(10+90*Math.max(0,Math.min(1,(ev.clientX-b.left)/b.width))); };
    let drag=false;
    bar.addEventListener("pointerdown",ev=>{ drag=true; setFrom(ev); try{ bar.setPointerCapture(ev.pointerId); }catch(_){} });
    bar.addEventListener("pointermove",ev=>{ if(drag) setFrom(ev); });
    bar.addEventListener("pointerup",()=>drag=false);
    p.addEventListener("click",ev=>{ ev.stopPropagation(); const s=ev.target.dataset.d; if(s) setDim(UI.dim+(+s)); });
    uiApply();
  };
  document.addEventListener("click",e=>{ const p=$("dimPop"); if(p && !p.contains(e.target) && e.target!==d) p.remove(); });
  uiApply();
}
/* Lively: Regler "dim" und Schalter "anim" – es gilt die letzte Änderung */
function uiProp(name,val){
  if(name!=="dim" && name!=="anim") return false;
  if(!propGate(name,val)) return true;
  if(name==="dim") setDim(+val||100); else setAnim(!!val);
  return true;
}
if(typeof AIR!=="undefined") AIR.listeners.push(()=>{ for(const p of AIR.map.values()) if(p.emerg) uiAlert("sq-"+p.hex+"-"+p.sq); });


const scope = new Scope($("map"), {labels:14, font:17, big:true});
let SCALE=1, SW=2400, SH=1350;

/* ================== ICON-ZONE / TASKLEISTE ================== */
/* ================== ICON-ZONE (Spalten + Kalibrierung) / TASKLEISTE ================== */
// Maße in Windows-Pixeln (= CSS-Pixel im Wallpaper): unabhängig von Auflösung und Skalierung
function zoneSc(){ return Math.min(innerWidth/1920, innerHeight/1080) * CFG.ui; }
function zoneGeom(){
  const sc = zoneSc(), cols = Math.max(0, CFG.iconCols|0);
  const rail = cols ? Math.round((8+14+12)*sc) : 0;
  const zw = cols ? Math.round(cols*CFG.iconCellW + rail) : 0;
  const tb = Math.round(innerHeight*(CFG.taskbar||0)/100), tp = Math.round(innerHeight*(CFG.topbar||0)/100);
  const right = CFG.zoneSide==="right";
  return { zw, tb, tp, right, x0: right?0:zw, w: innerWidth-zw, h: innerHeight-tb-tp };
}
function drawZone(g, sc){
  const z=$("izone");
  if(!g.zw){ z.style.display="none"; z.innerHTML=""; return; }
  z.style.cssText=`position:fixed;top:${g.tp}px;left:${g.right?innerWidth-g.zw:0}px;width:${g.zw}px;height:${g.h}px;pointer-events:none;display:block`;
  // Konsole oben/unten auf dem Bildschirm
  const yTop = (g.h-SH*SCALE)/2 + 24*SCALE, yBot = yTop + (SH-48)*SCALE;
  const W=g.zw, rw=14*sc, X1=W-12*sc, X0=X1-rw, capH=34*sc, Ro=56*sc, Ri=Math.max(8*sc, Ro-capH), xL=4*sc, gap=6*sc;
  const shape = `M${X0},${yTop+rw/2} A${rw/2},${rw/2} 0 0 1 ${X1},${yTop+rw/2} L${X1},${yBot-Ro} A${Ro},${Ro} 0 0 1 ${X1-Ro},${yBot}
    L${xL+capH/2},${yBot} A${capH/2},${capH/2} 0 0 1 ${xL+capH/2},${yBot-capH} L${X0-Ri},${yBot-capH} A${Ri},${Ri} 0 0 0 ${X0},${yBot-capH-Ri} Z`;
  const L = yBot-yTop, seg = (f0,f1,c) => `<rect x="${X0-1}" y="${yTop+L*f0}" width="${rw+2}" height="${L*(f1-f0)}" fill="var(--${c})"/>`;
  const cut = f => `<rect x="${X0-1}" y="${yTop+L*f-gap/2}" width="${rw+2}" height="${gap}" fill="var(--bg)"/>`;
  const on = CFG.zoneFrame!==false;
  if(document.body.classList.contains("cockpit")){ // Glascockpit: dunkle Gehäuseblende statt Konsolenrahmen
    const m=10*sc, x=m, y=yTop, w=W-2*m, hh=yBot-yTop;
    z.innerHTML = on ? `<svg width="${W}" height="${g.h}" style="position:absolute;left:0;top:0;overflow:visible">
      <defs><linearGradient id="izG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17191c"/><stop offset="1" stop-color="#0d0f11"/></linearGradient></defs>
      <rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="${12*sc}" fill="url(#izG)" fill-opacity=".55" stroke="var(--bez2)" stroke-width="${2*sc}"/>
      <rect x="${x+8*sc}" y="${y+8*sc}" width="${w-16*sc}" height="${hh-16*sc}" rx="${7*sc}" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="${1.5*sc}"/>
      ${[0,1].map(i=>`<circle cx="${x+18*sc+i*(w-36*sc)}" cy="${y+hh-18*sc}" r="${3*sc}" fill="#2a2e33"/>`).join("")}
      <text x="${x+w/2}" y="${y+hh-16*sc}" font-family="B612, sans-serif" font-weight="700" font-size="${11*sc}" letter-spacing="${3*sc}" fill="#5a6068" text-anchor="middle" dominant-baseline="central">DESKTOP</text>
    </svg>` : "";
    return; }
  let cells="";
  if(CFG.iconGrid){ const cw=CFG.iconCellW, ch=CFG.iconCellH, cols=CFG.iconCols|0, rows=Math.floor((yBot-capH-gap)/ch);
    for(let c=0;c<cols;c++) for(let r=0;r<rows;r++) cells+=`<rect x="${c*cw+3}" y="${r*ch+3}" width="${cw-6}" height="${ch-6}" rx="6" fill="none" stroke="var(--c)" stroke-opacity=".55" stroke-dasharray="4 4"/>`; }
  const flip = g.right ? `transform="translate(${W},0) scale(-1,1)"` : "";
  const lblX = g.right ? W-(X0-Ri-10*sc) : X0-Ri-10*sc;
  z.innerHTML = `<svg width="${W}" height="${g.h}" style="position:absolute;left:0;top:0;overflow:visible">
    <defs><clipPath id="izClip"><path d="${shape}"/></clipPath></defs>
    <g ${flip}>${cells}
    ${on?`<g clip-path="url(#izClip)"><rect x="0" y="0" width="${W}" height="${g.h}" fill="var(--a)"/>
      ${seg(0,.07,"c")}${seg(.36,.62,"d")}${seg(.8,.9,"b")}
      ${cut(.07)}${cut(.36)}${cut(.62)}${cut(.8)}${cut(.9)}
      <rect x="${xL}" y="${yBot-capH-1}" width="${capH*1.1}" height="${capH+2}" fill="var(--c)"/>
      <rect x="${xL+capH*1.1}" y="${yBot-capH-1}" width="${gap}" height="${capH+2}" fill="var(--bg)"/></g>`:""}
    </g>
    ${on?`<text x="${lblX}" y="${yBot-capH/2}" font-family="Antonio, sans-serif" font-size="${capH*.72}" fill="#000" text-anchor="${g.right?"start":"end"}" dominant-baseline="central">00-ARCHIV</text>`:""}
  </svg>`;
}

function fit(){
  const g=zoneGeom(), w=g.w, h=g.h;
  SCALE = Math.min(innerWidth/1920, innerHeight/1080) * CFG.ui;
  SW = Math.max(1900, w/SCALE); SH = Math.max(1000, h/SCALE);
  SCALE = Math.min(SCALE, w/SW, h/SH);
  const st=$("stage"); st.style.width=SW+"px"; st.style.height=SH+"px";
  st.style.transform=`translate(${g.x0+(w-SW*SCALE)/2}px,${g.tp+(h-SH*SCALE)/2}px) scale(${SCALE})`;
  drawZone(g, SCALE);
  const fr=$("frame"); fr.style.width=(SW-48)+"px"; fr.style.height=(SH-48)+"px";
  const cw=SW-48-232, ch=SH-48-50;
  const MW=Math.floor(Math.max(600, cw-800-40));
  $("mapBox").style.width=MW+"px";
  scope.resize(MW, Math.floor(ch), (window.devicePixelRatio||1)*SCALE);
}
addEventListener("resize", fit);

function applyTheme(){ document.body.dataset.theme=CFG.theme; scope.invalidate(); }
$("btnTheme").onclick=()=>{ CFG.theme=(CFG.theme+1)%4; applyTheme(); saveCfg(); };
const RANGES=[40,60,80,120,160];
$("btnRange").onclick=()=>{ const i=RANGES.indexOf(CFG.range); CFG.range=RANGES[(i+1)%RANGES.length]; scope.invalidate(); saveCfg(); if(SETUP_DONE) saveSetup(); refreshGeo(geoRad()); loadAir(); renderPanel(); };

/* ---------- Liste + Statistik ---------- */
function vs(p){ if(p.rate==null||p.ground) return ["",""]; if(Math.abs(p.rate)<200) return ["—",""]; return [(p.rate>0?"▲":"▼")+" "+nf(Math.abs(p.rate)/1000,1)+"K", p.rate>0?"up":"dn"]; }
function renderPanel(){
  const list=planesSorted(), box=$("list");
  const rowsFit=Math.max(1, Math.floor(box.clientHeight/41));
  box.innerHTML=list.slice(0,rowsFit).map(o=>{ const p=o.p, [v,vc]=vs(p);
    return `<div class="row ${p.alt<10000?"low":"high"} ${AIR.sel===p.hex?"sel":""} ${p.emerg?"em":""}" data-hex="${p.hex}">
      <div class="cs">${p.call}</div><div class="ty">${p.type||"—"}</div><div>${fmtAlt(p)}</div><div class="${vc}">${v}</div><div>${Math.round(p.gs)}</div><div>${nf(UN.d(o.dist),1)}</div></div>`; }).join("");
  $("more").textContent = list.length>rowsFit ? T("+ {0} WEITERE", list.length-rowsFit) : "";
  const air=list.filter(o=>!o.p.ground);
  $("sCnt").textContent=list.length; $("sCnt2").textContent=T("IM UMKREIS {0}", distTxt(CFG.range,0));
  $("sbCount").textContent=T("{0} ZIELE", pad(list.length)); $("thKm").textContent=UN.dU();
  const hi=air.reduce((a,b)=>!a||b.p.alt>a.p.alt?b:a,null), fa=air.reduce((a,b)=>!a||b.p.gs>a.p.gs?b:a,null), ne=list[0];
  $("sHi").textContent=hi?fmtAlt(hi.p):"--"; $("sHi2").textContent=hi?hi.p.call:"—"; $("sbHigh").textContent=hi?fmtAlt(hi.p):"FL---";
  $("sFa").textContent=fa?Math.round(fa.p.gs)+" KT":"--"; $("sFa2").textContent=fa?fa.p.call:"—";
  $("sNe").textContent=ne?distTxt(ne.dist):"--"; $("sNe2").textContent=ne?ne.p.call:"—";
  $("srcTag").textContent = T(AIR.ok ? "LIVE · ALLE 10 S" : (AIR.msg||"VERBINDE …"));
  const sel=AIR.sel&&AIR.map.get(AIR.sel);
  $("dtTag").textContent = sel ? sel.hex.toUpperCase() : "—";
  $("detailBox").innerHTML = sel ? detailHTML() : `<div class="dt-hint">${T("FLUGZEUG IN DER KARTE ODER LISTE ANKLICKEN<br>FÜR HALTER, ROUTE UND FLUGDATEN.")}</div>`;
}
$("list").addEventListener("click", e=>{ const r=e.target.closest(".row"); if(r) selectPlane(AIR.sel===r.dataset.hex?null:r.dataset.hex); });
$("detailBox").addEventListener("click", e=>{ if(e.target.dataset.close) selectPlane(null); });
AIR.listeners.push(renderPanel);
let selTimer=null;
AIR.listeners.push(()=>{ clearTimeout(selTimer); if(AIR.sel) selTimer=setTimeout(()=>selectPlane(null), 180000); });
setInterval(()=>{ if(!paused) renderPanel(); }, 1000);

function tickClock(){ const d=new Date();
  $("cLoc").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $("cUtc").textContent=`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
  $("cPos").textContent=`${CFG.name.toUpperCase()} ${nf(CFG.lat,2)}°N ${nf(CFG.lon,2)}°${LX().E}`; }
setInterval(()=>{ if(!paused) tickClock(); },1000);

async function geocode(){
  if(!CFG.place) return;
  try{ const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(CFG.place)}&count=1&language=de`)).json();
    if(j.results&&j.results[0]){ CFG.lat=j.results[0].latitude; CFG.lon=j.results[0].longitude; CFG.name=j.results[0].name; scope.invalidate(); } }catch(e){}
}

function livelyWallpaperPlaybackChanged(data){ try{ const o=typeof data==="string"?JSON.parse(data):data; setPaused(!!o.IsPaused); }catch(e){} }
function setPaused(p){ paused=p; document.querySelectorAll("*").forEach(el=>el.style.animationPlayState=p?"paused":""); if(!p) requestAnimationFrame(loop); }
document.addEventListener("visibilitychange", ()=>setPaused(document.hidden));
let propTimer=null, fitTimer=null;
const GATED = new Set(["place","theme","lang","units","adsbProxy","iconCols","iconCellW","iconCellH","range"]);
function livelyPropertyListener(name,val){
  if(uiProp(name,val)) return;
  if(GATED.has(name) && !propGate(name,val)) return;
  switch(name){
    case "place": CFG.place=String(val||"").trim(); if(!CFG.place) return; clearTimeout(propTimer); propTimer=setTimeout(async()=>{ await geocode(); onLocationChanged(); },800); return;
    case "theme": CFG.theme=+val||0; applyTheme(); saveCfg(); return;
    case "adsbProxy": CFG.adsbProxy=String(val||"").trim(); clearTimeout(AIR.timer); AIR.timer=setTimeout(loadAir,500); return;
    case "range": CFG.range=Math.max(10,+val||120); scope.invalidate(); saveCfg(); refreshGeo(geoRad()); clearTimeout(AIR.timer); AIR.timer=setTimeout(loadAir,500); return;
    case "iconCols": CFG.iconCols=Math.max(0,+val|0); clearTimeout(fitTimer); fitTimer=setTimeout(fit,300); return;
    case "iconCellW": CFG.iconCellW=Math.max(40,+val||118); clearTimeout(fitTimer); fitTimer=setTimeout(fit,300); return;
    case "iconCellH": CFG.iconCellH=Math.max(40,+val||93); clearTimeout(fitTimer); fitTimer=setTimeout(fit,300); return;
    case "taskbar": CFG.taskbar=Math.max(0,+val||0); clearTimeout(fitTimer); fitTimer=setTimeout(()=>{fit();renderPanel();},300); return;
    case "zoneFrame": CFG.zoneFrame=!!val; clearTimeout(fitTimer); fitTimer=setTimeout(fit,300); return;
    case "iconGrid": CFG.iconGrid=!!val; clearTimeout(fitTimer); fitTimer=setTimeout(fit,300); return;
    case "lang": CFG.lang=(+val===1)?"en":"de"; try{ localStorage.setItem("ops-lang",CFG.lang); }catch(e){} refreshLang(); return;
    case "units": CFG.units=(+val===1)?"imperial":"metric"; try{ localStorage.setItem("ops-units",CFG.units); }catch(e){} refreshLang(); return;
    case "ui": CFG.ui=Math.max(.5,Math.min(1.3,(+val||80)/100)); clearTimeout(fitTimer); fitTimer=setTimeout(()=>{fit();renderPanel();},300); return;
  }
}

let lastFrame=0;
function loop(now){ if(paused) return; requestAnimationFrame(loop); if(now-lastFrame<33) return; lastFrame=now; if(hasLoc()) scope.draw(now); }

function refreshLang(){ document.documentElement.lang=CFG.lang; applyStatic(); uiApply(); drawLangBtn(); tickClock(); scope.invalidate(); renderPanel(); }
tagStatic();
const drawLangBtn = langButton($("langBtn"), refreshLang);
const geoRad = () => Math.max(CFG.range*2.2, 200);
GEO_LISTENERS.push(()=>scope.invalidate());
function onLocationChanged(){ if(!hasLoc()) return; AIR.map.clear(); selectPlane(null); scope.invalidate(); refreshGeo(geoRad()); tickClock(); loadAir(); }
function onSetupApplied(ch){ applyTheme(); refreshLang(); fit(); renderPanel();
  if(ch.moved) onLocationChanged(); else { if(ch.rangeCh){ scope.invalidate(); refreshGeo(geoRad()); } if(ch.rangeCh||ch.proxyCh) loadAir(); } }
gearButton($("gearBtn")); uiButtons();

applyTheme(); fit(); tickClock(); renderPanel(); if(isEN()||IMP()) refreshLang();
requestAnimationFrame(loop);
(async()=>{ await geocode();
  if(!hasLoc()){ openSetup(); return; }
  loadAir(); refreshGeo(geoRad());
  if(!SETUP_DONE) setTimeout(()=>{ if(!SETUP_DONE) openSetup(); }, 2500); })();
</script>
